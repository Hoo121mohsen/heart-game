<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی حدس قلب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- دکمه باز و بستن تنظیمات -->
    <button id="toggleSettings" class="btn-settings">⚙️ تنظیمات تصاویر</button>

    <!-- بخش تنظیمات (در حالت عادی مخفی است) -->
    <div id="settingsPanel" class="settings-panel hidden">
      <h3>تنظیمات بازی</h3>
      
      <div class="upload-group">
        <label>عکس کلمه «الله»:</label>
        <input type="file" id="allahInput" accept="image/*">
      </div>

      <div class="upload-group">
        <label>عکس کلمه «الحی»:</label>
        <input type="file" id="alhaiInput" accept="image/*">
      </div>

      <div class="upload-group">
        <label>۱۰ عکس جایزه از گالری:</label>
        <input type="file" id="imageInput" accept="image/*" multiple>
      </div>

      <p id="uploadStatus" class="status-text"></p>
    </div>

    <!-- بخش اصلی بازی -->
    <div class="game-section">
      <h2 class="instruction">پشت قلب کدام کلمه است؟ حدس بزنید!</h2>

      <div class="options">
        <button class="btn-choice" onclick="makeGuess('الله')">الله</button>
        <button class="btn-choice" onclick="makeGuess('الحی')">الحی</button>
      </div>

      <div class="heart-box">
        <div id="heart" class="heart beating">❤️</div>
        <div id="rewardContainer" class="reward-container hidden">
          <img id="rewardImage" src="" alt="تصویر">
        </div>
      </div>

      <p id="message" class="message"></p>

      <!-- دکمه شروع مجدد -->
      <button id="resetBtn" class="btn-reset hidden" onclick="resetGame()">بازی مجدد 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
