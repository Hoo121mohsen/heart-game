name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Organize Web Files
        run: |
          mkdir www
          cp index.html style.css script.js www/

      - name: Install Capacitor & Prepare Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # ساخت فایل کانفیگ کاپاسیتور
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.example.heartgame",
            "appName": "HeartGame",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android

          # ساخت فایل‌های مورد نیاز اندروید که کپاسیتیور برای ایجادشون خطای sync میده
          mkdir -p android/app/src/main/assets
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json

          npx cap copy android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeartGame-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
